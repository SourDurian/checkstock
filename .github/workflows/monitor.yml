name: VMISS Stock Monitor

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send an SMTP test message without checking stock
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vmiss-stock-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: ${{ !inputs.send_test_email }}
      - name: Send test email or check stock
        shell: bash
        run: |
          if [[ "${TEST_EMAIL}" == "true" ]]; then
            pnpm monitor
          else
            xvfb-run --auto-servernum pnpm monitor
          fi
        env:
          TEST_EMAIL: ${{ inputs.send_test_email || false }}
          MONITOR_HEADLESS: false
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Persist monitor state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- .monitor-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor-state.json
          git commit -m "chore: update monitor state [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
